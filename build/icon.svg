<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Afterglow sky: deep indigo night fading through magenta to a warm horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10173a"/>
      <stop offset="0.32" stop-color="#2c2a66"/>
      <stop offset="0.55" stop-color="#6f3f8c"/>
      <stop offset="0.72" stop-color="#c75672"/>
      <stop offset="0.84" stop-color="#f2814f"/>
      <stop offset="0.95" stop-color="#ffb45c"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffb45c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb45c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191536"/>
      <stop offset="1" stop-color="#0c0a22"/>
    </linearGradient>
    <linearGradient id="windowWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffefb0"/>
      <stop offset="1" stop-color="#ffb54d"/>
    </linearGradient>
    <!-- subtle glass sheen across the top of the tile -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="tileShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- drop shadow behind the tile -->
  <rect x="100" y="118" width="824" height="824" rx="186" fill="#000000" opacity="0.32" filter="url(#tileShadow)"/>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="234" cy="208" r="5" opacity="0.85"/>
      <circle cx="356" cy="164" r="3.4" opacity="0.6"/>
      <circle cx="486" cy="226" r="4.2" opacity="0.75"/>
      <circle cx="632" cy="156" r="3" opacity="0.55"/>
      <circle cx="756" cy="232" r="5" opacity="0.8"/>
      <circle cx="836" cy="330" r="3.2" opacity="0.5"/>
      <circle cx="184" cy="330" r="3.2" opacity="0.5"/>
      <circle cx="558" cy="140" r="2.6" opacity="0.45"/>
      <circle cx="692" cy="292" r="3.6" opacity="0.6"/>
      <circle cx="300" cy="282" r="2.8" opacity="0.5"/>
    </g>

    <!-- setting-sun glow on the horizon -->
    <ellipse cx="512" cy="790" rx="560" ry="330" fill="url(#sunglow)"/>

    <!-- ground -->
    <rect x="100" y="770" width="824" height="154" fill="url(#ground)"/>

    <!-- house silhouette -->
    <g>
      <!-- chimney -->
      <rect x="618" y="468" width="44" height="130" fill="#151132"/>
      <!-- roof -->
      <polygon points="330,586 512,428 694,586" fill="#151132"/>
      <!-- body -->
      <rect x="362" y="576" width="300" height="200" fill="#1a1440"/>

      <!-- window glow halos -->
      <g filter="url(#soft)">
        <rect x="398" y="616" width="80" height="86" fill="#ffcf7d" opacity="0.85"/>
        <rect x="546" y="616" width="80" height="86" fill="#ffcf7d" opacity="0.85"/>
        <rect x="482" y="652" width="60" height="124" fill="#ffcf7d" opacity="0.8"/>
      </g>
      <!-- windows -->
      <rect x="402" y="620" width="72" height="78" rx="6" fill="url(#windowWarm)"/>
      <rect x="550" y="620" width="72" height="78" rx="6" fill="url(#windowWarm)"/>
      <!-- window mullions -->
      <g stroke="#1a1440" stroke-width="7">
        <line x1="438" y1="620" x2="438" y2="698"/>
        <line x1="402" y1="659" x2="474" y2="659"/>
        <line x1="586" y1="620" x2="586" y2="698"/>
        <line x1="550" y1="659" x2="622" y2="659"/>
      </g>
      <!-- door -->
      <rect x="486" y="656" width="52" height="120" rx="6" fill="url(#windowWarm)"/>
      <!-- attic window -->
      <circle cx="512" cy="530" r="26" fill="url(#windowWarm)"/>
      <circle cx="512" cy="530" r="26" fill="none" stroke="#151132" stroke-width="7"/>
      <line x1="512" y1="504" x2="512" y2="556" stroke="#151132" stroke-width="7"/>
    </g>

    <!-- soft light pool from the doorway onto the ground -->
    <ellipse cx="512" cy="784" rx="88" ry="16" fill="#ffcf7d" opacity="0.4" filter="url(#soft)"/>

    <!-- glass sheen -->
    <rect x="100" y="100" width="824" height="420" fill="url(#sheen)"/>
  </g>

  <!-- hairline edge highlight -->
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>
</svg>
